[tool.ruff]
target-version = "py312"
line-length = 110
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "T20", # no print statements
]
ignore = [
    "S101",  # assert in tests
    "S105",  # hardcoded password — false positives on config keys
    "S106",
    "B008",  # function call in default arg (FastAPI Depends pattern)
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "T20"]
"backend/alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "structlog.*", "moto.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
# Adds backend/ to sys.path so `import app` resolves to backend/app/
pythonpath = ["backend"]
# Coverage measured only on Phase 0 new modules; pre-existing modules gain
# coverage as integration tests are added in Phases 1A–1G.
addopts = "--cov=app.core --cov=app.worker --cov-report=term-missing --cov-fail-under=75 -v"

[tool.coverage.run]
source = ["app.core", "app.worker"]
omit = ["*/tests/*", "*/alembic/*", "*/scripts/*", "*/main.py"]
