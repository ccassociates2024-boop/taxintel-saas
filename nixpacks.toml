[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "libpq"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[phases.build]
cmds = []

[start]
cmd = "alembic --config backend/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHONPATH = "/app/backend"
